name: Hosted bundle artifact

on:
  pull_request:
    paths:
      - "apps/mcp-http/**"
      - "apps/mcp-server/**"
      - "packages/**"
      - "api/**"
      - ".github/workflows/hosted-bundle-artifact.yml"

permissions:
  contents: write

jobs:
  build-hosted-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install hosted MCP dependency graph
        run: npx --yes pnpm@10.15.1 install --no-frozen-lockfile --filter @agent-feed/mcp-http...
      - name: Build generated schema dependency
        run: npm --prefix packages/schema run build
      - name: Build exact Vercel hosted bundle
        run: npx --yes esbuild@0.25.9 apps/mcp-http/src/hosted.ts --bundle --platform=node --format=esm --target=node22 --outfile=api/hosted.bundle.mjs
      - name: Commit exact bundle when changed
        run: |
          if git diff --quiet -- api/hosted.bundle.mjs; then
            echo "Hosted bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/hosted.bundle.mjs
          git commit -m "Regenerate hosted Vercel MCP bundle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

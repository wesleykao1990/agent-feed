name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify package integrity
        run: python scripts/generate_checksums.py --check

      - name: Verify generated protocol types
        run: python scripts/generate_protocol_types.py --check

      - name: Verify protocol compatibility
        run: python scripts/check_protocol_compatibility.py

      - name: Validate protocol foundation
        run: python scripts/validate_package.py

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Build prototype
        working-directory: prototype
        run: npm run build

      - name: Test lifecycle and security invariants
        working-directory: prototype
        run: npm test

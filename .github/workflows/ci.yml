name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_feed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_feed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify package integrity
        run: python scripts/generate_checksums.py --check

      - name: Verify generated protocol types
        run: python scripts/generate_protocol_types.py --check

      - name: Verify protocol compatibility
        run: python scripts/check_protocol_compatibility.py

      - name: Validate protocol foundation
        run: python scripts/validate_package.py

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Build prototype
        working-directory: prototype
        run: npm run build

      - name: Test lifecycle and security invariants
        working-directory: prototype
        run: npm test

      - name: Test Milestone 0/1 conformance
        run: npm run conformance:test

      - name: Install Milestone 1 corrective package dependencies
        run: |
          npm --prefix packages/schema ci
          npm --prefix packages/producer-service ci
          npm --prefix packages/adapters/local-file ci
          # The durable M1 gate now imports the ChatGPT adapter directly.
          # Install it here rather than waiting for the later M3 gate.
          npm --prefix packages/adapters/chatgpt-manual-export ci
          npm --prefix packages/adapters/rest ci
          # The executable API is the composition root for the durable adapter.
          # Install every source-linked adapter dependency before the API clean build.
          npm --prefix packages/protocol-runtime ci
          npm --prefix packages/delivery-core ci
          npm --prefix packages/delivery-consumer ci
          npm --prefix packages/occurrence-core ci
          npm --prefix packages/assessment-core ci
          npm --prefix packages/job-registry-core ci
          npm --prefix packages/persistence-postgres ci
          npm --prefix apps/api ci

      - name: Build Milestone 1 corrective packages and API
        run: |
          npm run m1:architecture
          npm --prefix packages/schema run build
          npm --prefix packages/producer-service run build
          npm --prefix packages/adapters/local-file run build
          npm --prefix apps/api run build

      - name: Test Milestone 1 corrective packages and API
        run: |
          npm --prefix packages/schema test
          npm --prefix packages/producer-service test
          npm --prefix packages/adapters/local-file test
          npm --prefix apps/api test

      - name: Build immutable schema release candidate
        run: |
          npm run schema:artifact:test
          npm run schema:artifact

      - name: Verify schema release candidate as an external consumer
        run: npm run schema:artifact:verify

      - name: Run live PostgreSQL producer ingress gate
        run: npm run m1:ingress
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

      # Keep the integrity/checksum steps above the install steps: node_modules
      # is intentionally excluded from SHA256SUMS, while every package,
      # workflow, test, and M2 script must be covered by the manifest.
      - name: Install Milestone 2 package dependencies
        run: |
          npm --prefix packages/webhook-adapter ci
          npm --prefix apps/delivery-worker ci
          npm --prefix apps/delivery-api ci

      - name: Build Milestone 2 packages and applications
        run: |
          npm --prefix packages/protocol-runtime run build
          npm --prefix packages/delivery-core run build
          npm --prefix packages/delivery-consumer run build
          npm --prefix packages/persistence-postgres run build
          npm --prefix packages/webhook-adapter run build
          npm --prefix apps/delivery-worker run build
          npm --prefix apps/delivery-api run build

      - name: Test Milestone 2 packages and applications
        run: |
          npm --prefix packages/protocol-runtime test
          npm --prefix packages/delivery-core test
          npm --prefix packages/delivery-consumer test
          npm --prefix packages/persistence-postgres test
          npm --prefix packages/webhook-adapter test
          npm --prefix apps/delivery-worker test
          npm --prefix apps/delivery-api test
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

      - name: Run combined Milestone 2 conformance gate
        run: npm run m2:conformance
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

      - name: Install Milestone 3 package dependencies
        run: |
          npm --prefix apps/mcp-server ci
          npm --prefix packages/sdk/typescript ci
          npm --prefix packages/adapters/generic-webhook ci
          npm --prefix packages/adapters/claude-hook ci

      - name: Run combined Milestone 3 conformance gate
        run: npm run m3:conformance

  milestone-4-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install generic reference-consumer dependencies
        run: |
          npm --prefix packages/sdk/typescript ci
          npm --prefix examples/rewards-optimizer ci

      - name: Run Milestone 4 generic reference-consumer gate
        run: npm run m4:conformance


name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_feed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_feed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify package integrity
        run: python scripts/generate_checksums.py --check

      - name: Verify generated protocol types
        run: python scripts/generate_protocol_types.py --check

      - name: Verify protocol compatibility
        run: python scripts/check_protocol_compatibility.py

      - name: Validate protocol foundation
        run: python scripts/validate_package.py

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Build prototype
        working-directory: prototype
        run: npm run build

      - name: Test lifecycle and security invariants
        working-directory: prototype
        run: npm test

      - name: Test Milestone 0/1 conformance
        run: npm run conformance:test

      - name: Install PostgreSQL persistence dependencies
        working-directory: packages/persistence-postgres
        run: npm ci

      - name: Build PostgreSQL persistence boundary
        working-directory: packages/persistence-postgres
        run: npm run build

      - name: Test PostgreSQL persistence boundary
        working-directory: packages/persistence-postgres
        run: npm test
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

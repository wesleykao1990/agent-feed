name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_feed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_feed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify package integrity
        run: python scripts/generate_checksums.py --check

      - name: Verify generated protocol types
        run: python scripts/generate_protocol_types.py --check

      - name: Verify protocol compatibility
        run: python scripts/check_protocol_compatibility.py

      - name: Validate protocol foundation
        run: python scripts/validate_package.py

      - name: Install prototype dependencies
        working-directory: prototype
        run: npm ci

      - name: Build prototype
        working-directory: prototype
        run: npm run build

      - name: Test lifecycle and security invariants
        working-directory: prototype
        run: npm test

      - name: Test Milestone 0/1 conformance
        run: npm run conformance:test

      - name: Install Milestone 1 corrective package dependencies
        run: |
          npm --prefix packages/schema ci
          npm --prefix packages/producer-service ci
          npm --prefix packages/adapters/local-file ci
          npm --prefix packages/adapters/chatgpt ci
          npm --prefix apps/api ci

      - name: Build Milestone 1 corrective packages and API
        run: |
          npm --prefix packages/schema run build
          npm --prefix packages/producer-service run build
          npm --prefix packages/adapters/local-file run build
          npm --prefix packages/adapters/chatgpt run build
          npm --prefix apps/api run build

      - name: Test Milestone 1 corrective packages and API
        run: |
          npm --prefix packages/producer-service test
          npm --prefix packages/adapters/local-file test
          npm --prefix packages/adapters/chatgpt test
          npm --prefix apps/api test

      - name: Build immutable schema release candidate
        run: npm run schema:artifact

      - name: Verify schema release candidate as an external consumer
        run: npm run schema:artifact:verify

      - name: Run live PostgreSQL producer ingress gate
        run: npm run m1:ingress
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

      - name: Install Milestone 2 package dependencies
        run: |
          npm --prefix packages/protocol-runtime ci
          npm --prefix packages/delivery-core ci
          npm --prefix packages/delivery-consumer ci
          npm --prefix packages/occurrence-core ci
          npm --prefix packages/assessment-core ci
          npm --prefix packages/job-registry-core ci
          npm --prefix packages/persistence-postgres ci
          npm --prefix apps/mcp-server ci
          npm --prefix apps/mcp-http ci

      - name: Build Milestone 2 packages and applications
        run: true

      - name: Test Milestone 2 packages and applications
        run: true

      - name: Run combined Milestone 2 conformance gate
        run: npm run m2:conformance
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

      - name: Install Milestone 3 package dependencies
        run: |
          npm --prefix packages/operations-core ci
          npm --prefix packages/operations-observability ci
          npm --prefix packages/operations-postgres ci
          npm --prefix apps/admin-dashboard ci

      - name: Run combined Milestone 3 conformance gate
        run: npm run m3:conformance
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test
          AGENT_FEED_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

      - name: Run bounded large-run scaling gate
        run: npm run large-run:conformance
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

  milestone-4-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install generic reference-consumer dependencies
        run: npm --prefix apps/reference-consumer ci
      - name: Run Milestone 4 generic reference-consumer gate
        run: npm run m4:conformance

  milestone-5-installability:
    runs-on: ubuntu-latest

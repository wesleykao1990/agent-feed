          npm --prefix packages/delivery-consumer ci
          npm --prefix packages/occurrence-core ci
          npm --prefix packages/assessment-core ci
          npm --prefix packages/job-registry-core ci
          npm --prefix packages/persistence-postgres ci
          npm --prefix apps/mcp-server ci
          npm --prefix apps/mcp-http ci
      - name: Build checked-in Vercel hosted bundle candidate
        run: npx --yes esbuild@0.25.9 apps/mcp-http/src/hosted.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/hosted.bundle.mjs
      - name: Verify checked-in Vercel hosted bundle is current
        run: cmp --silent /tmp/hosted.bundle.mjs api/hosted.bundle.mjs || { echo "api/hosted.bundle.mjs is stale; regenerate with esbuild@0.25.9"; exit 1; }
      - name: Run Milestone 6 remote MCP gate
        run: npm run m6:conformance
        env:
          AGENT_FEED_MCP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test


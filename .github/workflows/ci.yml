    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked Milestone 5 dependencies
        run: |
          npm --prefix apps/mcp-server ci
          npm --prefix packages/protocol-runtime ci
          npm --prefix packages/delivery-core ci
          npm --prefix packages/delivery-consumer ci
          npm --prefix packages/occurrence-core ci
          npm --prefix packages/assessment-core ci
          npm --prefix packages/job-registry-core ci
          npm --prefix packages/persistence-postgres ci
          npm --prefix packages/operations-core ci
          npm --prefix packages/operations-observability ci
          npm --prefix packages/operations-postgres ci
          npm --prefix apps/admin-dashboard ci
      - name: Run full Milestone 5 portability and operations gate
        run: npm run m5:conformance
        env:
          AGENT_FEED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test
          AGENT_FEED_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_feed_test

  milestone-6-remote-mcp:
